    <!-- Icone da tela inicial do celular. Sem estas linhas o Android Chrome
         desenha a inicial do titulo (a letra "P") e o iOS usa um retrato da

         `public/manifest.webmanifest` como SVG, que e TEXTO CURTO. A lista
         `preventAI` impede o agente do Skip de gravar imagem, e base64 longa
         nao sobrevive ao paste: o agente reconstroi o miolo da string e
         devolve um PNG que parece valido e nao decodifica. SVG resolve porque
         cabe em ~700 caracteres legiveis. -->

    <script>
      // Graceful degradation: prevent SecurityError when libraries (e.g. html-to-image)
      // iterate cross-origin stylesheet cssRules. Returns an empty CSSRuleList-like array
      // instead of throwing, so the calling code can continue without crashing the UI.
      ;(function () {
        var proto = CSSStyleSheet.prototype
        var desc = Object.getOwnPropertyDescriptor(proto, 'cssRules')
        if (desc && desc.get) {
          var origGet = desc.get
          try {
            Object.defineProperty(proto, 'cssRules', {
              get: function () {
                try {
                  return origGet.call(this)
                } catch (e) {
                  return []
                }
              },
              configurable: true,
            })
          } catch (_) {}
        }
        var rulesDesc = Object.getOwnPropertyDescriptor(proto, 'rules')
        if (rulesDesc && rulesDesc.get) {
          var origRulesGet = rulesDesc.get
          try {
            Object.defineProperty(proto, 'rules', {
              get: function () {
                try {
                  return origRulesGet.call(this)
                } catch (e) {
                  return []
                }
              },
              configurable: true,
            })
          } catch (_) {}
        }
      })()
